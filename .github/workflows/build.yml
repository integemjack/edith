# 每次推送：全平台、全架构编译打包；能在运行器上原生跑的（含 Rosetta、WOW64、x64 上跑 32 位）同时跑端到端冒烟测试
# （tests/smoke.rs：假模型 + 假四肢）。推到 main 的再发一个 Release（只留最新一个，标签保留）。
# 版本号 v<Cargo.toml 版本的前两位>.<这个工作流的运行序号>。
# Linux 一律用 zig（cargo-zigbuild）编成 musl 静态程序：不挑发行版、不挑 glibc 版本（s390x 没有 musl 的标准库，用 glibc 2.17）。
# core/ 是子模块 integemjack/friday.core（公开），按钉住的提交拉。
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: macos-arm64, os: macos-15, target: aarch64-apple-darwin, test: true }
          - { key: macos-x64, os: macos-15, target: x86_64-apple-darwin, test: true }
          - { key: windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc, test: true }
          - { key: windows-x86, os: windows-2022, target: i686-pc-windows-msvc, test: true }
          - { key: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, test: true }
          - { key: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-musl, zig: true, test: true }
          - { key: linux-x86, os: ubuntu-22.04, target: i686-unknown-linux-musl, zig: true }
          - { key: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, zig: true, test: true }
          - { key: linux-armv7, os: ubuntu-22.04, target: armv7-unknown-linux-musleabihf, zig: true }
          - { key: linux-armv6, os: ubuntu-22.04, target: arm-unknown-linux-musleabihf, zig: true }
          - { key: linux-riscv64, os: ubuntu-22.04, target: riscv64gc-unknown-linux-musl, zig: true }
          - { key: linux-loong64, os: ubuntu-22.04, target: loongarch64-unknown-linux-musl, zig: true }
          - { key: linux-ppc64le, os: ubuntu-22.04, target: powerpc64le-unknown-linux-musl, zig: true }
          - { key: linux-s390x, os: ubuntu-22.04, target: s390x-unknown-linux-gnu, zig_target: s390x-unknown-linux-gnu.2.17, zig: true }
    env:
      TARGET: ${{ matrix.target }}
      BUILD_TARGET: ${{ matrix.zig_target || matrix.target }}
      BUILD: ${{ matrix.zig && 'cargo zigbuild' || 'cargo build' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Pinned friday.core commit
        id: core
        shell: bash
        run: echo "sha=$(git -C core rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        shell: bash
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\)\.\([0-9]*\)\..*"/\1.\2/p' Cargo.toml | head -1)
          echo "tag=v${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # rust-toolchain.toml 定版本，rustup 第一次用时自动装；目标平台的标准库另加
      - name: Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - name: Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.key }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ steps.core.outputs.sha }}
          restore-keys: cargo-${{ matrix.key }}-

      # zig 编的（musl 静态）测试在这台机器原生的 glibc 目标上跑，打出来的程序再跑一下 --version
      - name: Test
        if: matrix.test
        shell: bash
        run: |
          if [ -n "${{ matrix.zig }}" ]; then cargo test --locked --release; else cargo test --locked --release --target "$TARGET"; fi

      - name: Build
        shell: bash
        run: $BUILD --locked --release --target "$BUILD_TARGET"

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="edith-${{ steps.version.outputs.tag }}-${{ matrix.key }}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/edith" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -R docs examples "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          file "target/$TARGET/release/edith" || true
          if [ "${{ matrix.test }}" = "true" ]; then "target/$TARGET/release/edith" --version; fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "edith-${{ steps.version.outputs.tag }}-${{ matrix.key }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/$env:TARGET/release/edith.exe", README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Copy-Item -Recurse docs, examples "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
          & "target/$env:TARGET/release/edith.exe" --version

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: edith-${{ matrix.key }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\)\.\([0-9]*\)\..*"/\1.\2/p' Cargo.toml | head -1)
          tag="v${base}.${{ github.run_number }}"
          (cd dist && sha256sum * > SHA256SUMS)
          notes="EDITH ${tag}（$(git log -1 --format=%s)）

          解压得到 edith（Windows 是 edith.exe），用法见 README.md；能力协议见 docs/CAPABILITY-PROTOCOL.md；共用的工具 edith tools 自己下（integemjack/edith.tools）。
          - macOS：arm64、x64
          - Windows：x64、x86、arm64
          - Linux（musl 静态程序，任何发行版都能跑）：x64、x86、arm64、armv7、armv6、riscv64、loong64、ppc64le；s390x（glibc ≥ 2.17）"
          gh release create "$tag" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "EDITH ${tag}" --notes "$notes"
          # 只留最新的一个 Release（标签留着）
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName -q '.[].tagName' \
            | { grep -vx "$tag" || true; } | while read -r old; do gh release delete "$old" --repo "${{ github.repository }}" -y; done
